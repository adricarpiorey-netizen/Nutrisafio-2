name: Compilar Nutrisafio Yippie
on:
  push:
    paths: ['yippie/**', '.github/workflows/yippie.yml']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descomprimir el codigo
        run: cd yippie && unzip -o -q codigo.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current
      - name: Compilar
        working-directory: yippie
        run: gradle build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: nutrisafio-yippie
          path: yippie/build/libs/*.jar
