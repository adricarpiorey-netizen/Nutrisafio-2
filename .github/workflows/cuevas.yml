name: Buscar cuevas Alex Caves
on: [workflow_dispatch, push]
permissions:
  contents: write
jobs:
  buscar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Preparar servidor de prueba
        run: |
          mkdir -p srv/mods && cd srv
          curl -sSL -o server.jar https://meta.fabricmc.net/v2/versions/loader/1.21.1/0.16.14/1.0.1/server/jar
          FAPI=$(curl -s 'https://api.modrinth.com/v2/project/fabric-api/version?game_versions=%5B%221.21.1%22%5D&loaders=%5B%22fabric%22%5D' | python3 -c "import sys,json;print(json.load(sys.stdin)[0]['files'][0]['url'])")
          curl -sSL -o mods/fabric-api.jar "$FAPI"
          curl -sSL -o mods/alexscaves.jar https://cdn.modrinth.com/data/Jj8KJUGX/versions/FEmo5ugU/alexscaves-2.0.2-6.jar
          unzip -p mods/alexscaves.jar fabric.mod.json | head -60
          echo "eula=true" > eula.txt
          printf "level-seed=213751504249139\nonline-mode=false\nspawn-protection=0\n" > server.properties
          ls -la mods
      - name: Arrancar y buscar
        working-directory: srv
        run: |
          ( sleep 150; while read c; do echo "$c"; sleep 4; done < ../cuevas/cmds.txt; sleep 30; echo stop ) | timeout 900 java -Xmx5G -jar server.jar nogui > salida.log 2>&1 || true
          grep -E "nearest|Could not find|ERROR|Exception|Done \(" salida.log | head -80
      - name: Publicar
        run: |
          mkdir -p /tmp/pub && cp srv/salida.log /tmp/pub/ && cd /tmp/pub && git init -q && git checkout -q -b salida-cuevas && git add . && git -c user.name=bot -c user.email=bot@x commit -qm cuevas && git push -f https://x-access-token:${{ github.token }}@github.com/${{ github.repository }} salida-cuevas
